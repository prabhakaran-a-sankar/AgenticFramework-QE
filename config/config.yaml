# Quality Engineering Agentic Framework Configuration

# LLM Configuration
llm:
  provider: openai  # Options: openai, gemini, copilot
  model: gpt-4o
  api_key: ""       # Your API key (or set via OPENAI_API_KEY env var)
  temperature: 0.2
  max_tokens: 8000

# Logging Configuration
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/qeaf.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# System Configuration
system:
  cache_dir: ".cache"
  timeout: 60  # Seconds
